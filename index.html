<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quicklist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">☷</span>
            <span>quicklist</span>
        </div>
    </header>

    <main class="container">

        <button class="back-button" id="backButton">
            ← Voltar
        </button>

        <h1>Compras da semana</h1>

        <section class="add-item">
            <input
                type="text"
                id="itemInput"
                placeholder="Adicione um novo item"
            >

            <button id="addButton">
                Adicionar item
            </button>
        </section>

        <ul id="itemList">

            <!-- Item 1 -->
            <li class="item">
                <label>
                    <input type="checkbox" class="item-checkbox">
                    <span class="item-name">Pão de forma</span>
                </label>

                <button class="remove-button" title="Remover item">
                    🗑
                </button>
            </li>

            <!-- Item 2 -->
            <li class="item">
                <label>
                    <input type="checkbox" class="item-checkbox">
                    <span class="item-name">Café preto</span>
                </label>

                <button class="remove-button" title="Remover item">
                    🗑
                </button>
            </li>

            <!-- Item 3 -->
            <li class="item">
                <label>
                    <input type="checkbox" class="item-checkbox">
                    <span class="item-name">Suco de laranja</span>
                </label>

                <button class="remove-button" title="Remover item">
                    🗑
                </button>
            </li>

            <!-- Item 4 -->
            <li class="item">
                <label>
                    <input type="checkbox" class="item-checkbox">
                    <span class="item-name">Bolacha</span>
                </label>

                <button class="remove-button" title="Remover item">
                    🗑
                </button>
            </li>

        </ul>

        <!-- Mensagem de alerta -->
        <div id="alertMessage" class="alert hidden">
            <span>ⓘ</span>

            <span id="alertText">
                O item foi removido da lista
            </span>

            <button id="closeAlert">×</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
