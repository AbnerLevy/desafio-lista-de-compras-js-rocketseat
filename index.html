<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compras</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <img src="./img/logo.png" alt="LISTA DE COMPRAS" class="logo">
        <h2>My List</h2>
    </header>

    <main class="container">

        <button onclick="window.location.href='obrigado.html'" class="back-button" id="backButton">
            ← Voltar
        </button>

        <h1>Lista de Compras</h1>

        <section class="add-item">
            <input type="text" id="itemInput" placeholder="Adicione um novo item">
            <button id="addButton">Adicionar item</button>
        </section>

        <ul id="itemList">

            <li class="item">
                <label>
                    <input type="checkbox" class="item-checkbox">
                    <span class="item-name">Pão de forma</span>
                </label>
                <button class="remove-button" title="Remover item">
                    <img src="./img/lixeira.png" alt="icone de lixeira">
                </button>
            </li>

            <li class="item">
                <label>
                    <input type="checkbox" class="item-checkbox">
                    <span class="item-name">Café preto</span>
                </label>

                <button class="remove-button" title="Remover item">
                    <img src="./img/lixeira.png" alt="icone de lixeira">
                </button>
            </li>

        </ul>

        <!-- Mensagem de alerta -->
        <section id="alertMessage" class="alert hidden">
            <img src="./img/Icon.png" alt="icone de alerta">
            <span id="alertText">O item foi removido da lista</span>
            <button id="closeAlert">X</button>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
